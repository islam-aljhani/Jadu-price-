<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بحث الأصناف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F1EFEA;
    --panel:#FFFFFF;
    --steel-900:#20272C;
    --steel-700:#374750;
    --steel-500:#5C6E77;
    --steel-200:#D7DEE0;
    --amber:#BD7A2C;
    --amber-dark:#8F5C20;
    --ok:#3E7A52;
    --warn:#B0432E;
    --line: rgba(32,39,44,0.12);
    --shadow: 0 1px 2px rgba(32,39,44,0.06), 0 8px 20px -12px rgba(32,39,44,0.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181C1F;
      --panel:#20262A;
      --steel-900:#F1EFEA;
      --steel-700:#C7D0D4;
      --steel-500:#8FA0A8;
      --steel-200:#33403A;
      --line: rgba(241,239,234,0.12);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181C1F;
    --panel:#20262A;
    --steel-900:#F1EFEA;
    --steel-700:#C7D0D4;
    --steel-500:#8FA0A8;
    --steel-200:#33403A;
    --line: rgba(241,239,234,0.12);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--steel-900);
    font-family:'Tajawal', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; direction:ltr; unicode-bidi:isolate; }

  .app{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 40px;
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:2px solid var(--steel-900);
  }
  header h1{
    font-size:20px;
    font-weight:900;
    margin:0;
    letter-spacing:0.2px;
  }
  header span{
    font-size:12px;
    color:var(--steel-500);
    font-weight:500;
  }

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .search-field{
    flex:1;
    position:relative;
  }
  .search-field input{
    width:100%;
    padding:14px 14px;
    font-size:16px;
    font-family:'IBM Plex Mono', monospace;
    direction:ltr;
    text-align:right;
    border:2px solid var(--steel-900);
    border-radius:3px;
    background:var(--panel);
    color:var(--steel-900);
    outline:none;
  }
  .search-field input:focus{
    border-color:var(--amber);
  }
  .search-field input::placeholder{
    font-family:'Tajawal', sans-serif;
    direction:rtl;
    color:var(--steel-500);
  }
  .scan-btn{
    flex-shrink:0;
    width:52px;
    border:2px solid var(--steel-900);
    background:var(--steel-900);
    color:var(--bg);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .scan-btn:active{ transform:scale(0.94); }
  .scan-btn svg{ width:24px; height:24px; }

  .hint{
    font-size:12.5px;
    color:var(--steel-500);
    margin:0 2px 22px;
  }

  /* Camera overlay */
  .cam-overlay{
    position:fixed; inset:0;
    background:#0A0D0E;
    z-index:50;
    display:none;
    flex-direction:column;
  }
  .cam-overlay.active{ display:flex; }
  .cam-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    color:#F1EFEA;
  }
  .cam-top h2{ font-size:15px; margin:0; font-weight:700; }
  .cam-close{
    background:none;border:1px solid rgba(241,239,234,0.4);
    color:#F1EFEA; width:34px;height:34px;border-radius:50%;
    font-size:18px; cursor:pointer; display:flex;align-items:center;justify-content:center;
  }
  .cam-stage{ position:relative; flex:1; overflow:hidden; }
  .cam-stage video{
    width:100%; height:100%; object-fit:cover;
    transform:scaleX(1);
  }
  .cam-frame{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .cam-frame .box{
    width:min(70vw,280px); height:min(70vw,280px);
    border:3px solid var(--amber);
    border-radius:16px;
    box-shadow:0 0 0 2000px rgba(10,13,14,0.55);
  }
  .cam-status{
    text-align:center; color:#F1EFEA; font-size:13px;
    padding:16px; opacity:0.75;
  }

  /* Result card */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:14px;
    animation: rise .25s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .card-top{
    display:flex; gap:14px;
    padding-bottom:14px;
    margin-bottom:14px;
    border-bottom:1px dashed var(--steel-200);
  }
  .thumb{
    width:64px; height:64px; flex-shrink:0;
    border-radius:6px;
    background:var(--steel-200);
    display:flex; align-items:center; justify-content:center;
  }
  .thumb svg{ width:34px; height:34px; color:var(--steel-500); }
  .card-title h3{
    margin:0 0 4px; font-size:16.5px; font-weight:700; line-height:1.35;
  }
  .card-title .maker{
    font-size:12.5px; color:var(--steel-500);
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 14px;
  }
  .stat{
    display:flex; flex-direction:column; gap:2px;
  }
  .stat .k{ font-size:11.5px; color:var(--steel-500); }
  .stat .v{ font-size:14.5px; font-weight:600; }

  .price-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
    padding-top:16px;
    border-top:2px solid var(--steel-900);
  }
  .price-row .price{
    font-family:'IBM Plex Mono', monospace;
    direction:ltr;
    font-size:26px; font-weight:600;
    color:var(--amber-dark);
  }
  .price-row .price sup{ font-size:13px; margin-inline-start:3px; color:var(--steel-500); font-family:'Tajawal'; }
  .stock{
    font-size:12.5px; font-weight:700;
    padding:5px 10px; border-radius:20px;
  }
  .stock.in{ background:rgba(62,122,82,0.12); color:var(--ok); }
  .stock.low{ background:rgba(191,138,20,0.14); color:#8F5C20; }
  .stock.out{ background:rgba(176,67,46,0.12); color:var(--warn); }

  .num-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    direction:ltr;
    font-size:11.5px;
    letter-spacing:0.4px;
    color:var(--steel-500);
    background:var(--bg);
    border:1px solid var(--line);
    padding:2px 8px;
    border-radius:3px;
    margin-top:2px;
  }

  .empty, .notfound{
    text-align:center;
    padding:46px 20px;
    color:var(--steel-500);
  }
  .empty svg, .notfound svg{ width:40px; height:40px; margin-bottom:12px; opacity:0.5; }
  .empty p, .notfound p{ margin:0; font-size:14px; line-height:1.7; }
  .notfound b{ color:var(--steel-900); }

  .results-meta{
    font-size:12px; color:var(--steel-500); margin:0 2px 10px;
  }

  footer{
    margin-top:30px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--steel-500);
    text-align:center;
  }
</style>
</head>

  <p class="hint">اكتب رقم الصنف أو جزء من الاسم، أو اضغط أيقونة المسح لتصوير الكيو آر كود</p>

  <div id="resultsMeta" class="results-meta" style="display:none;"></div>
  <div id="results"></div>
</div>

<!-- Camera overlay -->
<div class="cam-overlay" id="camOverlay">

  <canvas id="camCanvas" style="display:none;"></canvas>

</div>

function mapRow(r){
  const num = (r['رقم الصنف'] || '').toString().trim();
  const price = parseFloat(r['سعر القطاعي']) || 0;
  const qty = parseInt(r['الكمية']) || 0;
  return {
    number: num,
    name: (r['اسم الصنف'] || '').toString().trim(),
    maker: (r['الشركة المصنعه'] || '').toString().trim(),
    origin: (r['بلد الصنع'] || '').toString().trim(),
    color: (r['اللون'] || '').toString().trim(),
    price, qty,
    category: (r['تصنيف الرئيسي'] || '').toString().trim(),
  };
}

function loadFromSheet(){
  if(!SHEET_CSV_URL) return;
  el('itemCount').textContent = 'جارِ التحديث من الشيت…';
  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (res) => {
      const rows = res.data.map(mapRow).filter(it => it.number);
      if(rows.length){
        ITEMS = rows;
        el('itemCount').textContent = ITEMS.length + ' صنف مسجّل';
      }
    },
    error: () => {
      el('itemCount').textContent = ITEMS.length + ' صنف (بيانات محفوظة، تعذّر التحديث)';
    }
  });
}


const icons = {
  box: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  frown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><path d="M9 9h.01M15 9h.01"/></svg>`
};

const el = (id) => document.getElementById(id);
const resultsEl = el('results');
const metaEl = el('resultsMeta');
const input = el('searchInput');

el('itemCount').textContent = ITEMS.length + ' صنف مسجّل';

function stockBadge(qty){
  if(qty <= 0) return `<span class="stock out">غير متوفر</span>`;
  if(qty <= 5) return `<span class="stock low">كمية محدودة · ${qty}</span>`;
  return `<span class="stock in">متوفر · ${qty}</span>`;
}

function renderCard(item){
  const makerLine = [item.maker, item.origin].filter(Boolean).join(' · ') || '—';
  return `
    <div class="card">
      <div class="card-top">
        <div class="thumb">${icons.box}</div>
        <div class="card-title">
          <h3>${item.name}</h3>
          <div class="maker">${makerLine}</div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;">
            <div class="num-tag">#${item.number}</div>
            ${item.category ? `<div class="num-tag" style="font-family:'Tajawal',sans-serif;direction:rtl;">${item.category}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat"><span class="k">اللون</span><span class="v">${item.color || '—'}</span></div>
        <div class="stat"><span class="k">بلد المنشأ</span><span class="v">${item.origin || '—'}</span></div>
      </div>
      <div class="price-row">
        <div class="price">${item.price.toLocaleString('en-US')}<sup>د.ل</sup></div>
        ${stockBadge(item.qty)}
      </div>
    </div>`;
}

function renderEmpty(){
  metaEl.style.display = 'none';
  resultsEl.innerHTML = `
    <div class="empty">
      ${icons.search}
      <p>ابدأ بكتابة رقم الصنف أو اسمه<br>أو صوّر الكيو آر كود الملصق على المنتج</p>
    </div>`;
}

function renderNotFound(q){
  metaEl.style.display = 'none';
  resultsEl.innerHTML = `
    <div class="notfound">
      ${icons.frown}
      <p>لا يوجد صنف مطابق لـ «<b>${q}</b>»<br>تأكد من رقم الصنف أو جرّب اسمًا مختصرًا</p>
    </div>`;
}

function normSpace(s){ return (s || '').replace(/\s+/g, ' ').trim(); }

function search(q){
  q = q.trim();
  if(!q){ renderEmpty(); return; }
  const ql = normSpace(q).toLowerCase();
  const matches = ITEMS.filter(it =>
    it.number.toLowerCase() === ql ||
    it.number.toLowerCase().includes(ql) ||
    normSpace(it.name).toLowerCase().includes(ql)
  ).sort((a,b) => (a.number === q ? -1 : 0) - (b.number === q ? -1 : 0));

  if(matches.length === 0){ renderNotFound(q); return; }

  metaEl.style.display = 'block';
  const shown = matches.slice(0, 40);
  metaEl.textContent = matches.length > 40
    ? `${matches.length} نتيجة — عرض أول 40 (ضيّق البحث لعرض أدق)`
    : matches.length + ' نتيجة';
  resultsEl.innerHTML = shown.map(renderCard).join('');
}

input.addEventListener('input', (e) => search(e.target.value));
renderEmpty();
loadFromSheet();

// مسح الكيو آر كود بالكاميرا
// ---------------------------------------------------------------
const camOverlay = el('camOverlay');
const camVideo = el('camVideo');
const camCanvas = el('camCanvas');
const camStatus = el('camStatus');
let stream = null;
let scanning = false;

async function openCamera(){
  camOverlay.classList.add('active');
  camStatus.textContent = 'جارِ تشغيل الكاميرا…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    camVideo.srcObject = stream;
    await camVideo.play();
    scanning = true;
    camStatus.textContent = 'وجّه الكاميرا نحو الرمز داخل الإطار';
    requestAnimationFrame(tick);
  }catch(err){
    camStatus.textContent = 'تعذّر الوصول إلى الكاميرا — تأكد من منح الإذن';
  }
}

function closeCamera(){
  scanning = false;
  camOverlay.classList.remove('active');
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function tick(){
  if(!scanning) return;
  if(camVideo.readyState === camVideo.HAVE_ENOUGH_DATA && window.jsQR){
    const w = camVideo.videoWidth, h = camVideo.videoHeight;
    if(w && h){
      camCanvas.width = w;
      camCanvas.height = h;
      const ctx = camCanvas.getContext('2d');
      ctx.drawImage(camVideo, 0, 0, w, h);
      const imageData = ctx.getImageData(0, 0, w, h);
      const code = window.jsQR(imageData.data, w, h, { inversionAttempts: 'dontInvert' });
      if(code && code.data){
        const value = code.data.trim();
        input.value = value;
        search(value);
        camStatus.textContent = 'تم العثور على الرمز: ' + value;
        setTimeout(closeCamera, 500);
        return;
      }
    }
  }
  requestAnimationFrame(tick);
}

el('scanBtn').addEventListener('click', openCamera);
el('camClose').addEventListener('click', closeCamera);
